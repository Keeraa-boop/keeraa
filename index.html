<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keera Chic Accessories</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Georgia, serif;
      background: #f8efe2;
      color: #593b27;
    }

    .hero {
      height: 100vh;
      height: 100svh;
      min-height: 500px;
      width: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding: 35px 20px 45px;

      background-image:
        linear-gradient(
          to bottom,
          transparent 70%,
          rgba(53, 34, 21, 0.42) 100%
        ),
        url("file_0000000002a881f5b1d2d8523bdcbe60.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .hero-content {
      width: 100%;
      text-align: center;
    }

    .subtitle {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      margin-bottom: 22px;
      text-shadow: 0 2px 8px #493322;
    }

    .shop-button {
      display: inline-block;
      padding: 16px 22px;
      background: #fff1dc;
      color: #65452c;
      border: 1px solid #b8955d;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .scroll {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 20px;
      text-shadow: 0 2px 8px #493322;
    }

    .collection {
      padding: 60px 20px;
      text-align: center;
      background: #fbf6ef;
    }

    .label {
      color: #a5804d;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 36px;
      font-weight: normal;
      margin-bottom: 15px;
    }

    .description {
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.9;
      color: #8b7765;
      margin-bottom: 30px;
    }

    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 500px;
      margin: auto;
    }

    .category {
      padding: 28px 8px;
      background: #f2e5d3;
      border: 1px solid #dfc7a8;
      color: #65452c;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .category span {
      display: block;
      color: #b08a50;
      font-size: 25px;
      margin-bottom: 12px;
    }

    footer {
      padding: 30px 15px;
      background: #543824;
      color: #f8ead5;
      text-align: center;
    }

    footer div {
      font-size: 28px;
      margin-bottom: 8px;
    }

    footer p {
      color: #d8bb90;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 4px;
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="hero-content">
      <p class="subtitle">ELEGANCE IN EVERY DETAIL</p>

      <a href="#collection" class="shop-button">
        DISCOVER THE COLLECTION
      </a>

      <p class="scroll">SCROLL TO EXPLORE ↓</p>
    </div>
  </section>

  <section class="collection" id="collection">
    <p class="label">KEERA CHIC ACCESSORIES</p>

    <h1>Find Your Elegance</h1>

    <p class="description">
      Des accessoires délicats pour sublimer chaque détail.
    </p>

    <div class="categories">
      <a href="#collection" class="category">
        <span>✧</span>BAGUES
      </a>

      <a href="#collection" class="category">
        <span>◇</span>BOUCLES
      </a>

      <a href="#collection" class="category">
        <span>♡</span>PARURES
      </a>

      <a href="#collection" class="category">
        <span>⌁</span>COLLIERS
      </a>
    </div>
  </section>

  <footer>
    <div>Keera Chic</div>
    <p>ACCESSORIES</p>
  </footer>

</body>
</html>
